<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Regnskab – Tipsklub365</title>

  <style>
    :root{
      --bg:#0b0f17;
      --card:#0f172a;
      --muted: rgba(255,255,255,.72);
      --text: rgba(255,255,255,.92);
      --line: rgba(255,255,255,.10);
      --chip: rgba(255,255,255,.08);
      --accent: #7dd3fc;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background:
        radial-gradient(1200px 800px at 20% -10%, rgba(125,211,252,.18), transparent 55%),
        radial-gradient(900px 600px at 90% 10%, rgba(167,139,250,.14), transparent 55%),
        var(--bg);
      color:var(--text);
      line-height:1.45;
    }
    header{
      position:sticky; top:0;
      background:rgba(11,15,23,.72);
      backdrop-filter:blur(10px);
      border-bottom:1px solid var(--line);
      z-index:10;
    }
    .wrap{max-width:1020px;margin:0 auto;padding:16px}
    nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .brand{font-weight:800;margin-right:6px}
    nav a{
      color:var(--text);
      text-decoration:none;
      padding:10px 12px;
      border-radius:999px;
      background:var(--chip);
      border:1px solid var(--line);
      font-size:14px
    }
    nav a.active{
      border-color:rgba(125,211,252,.55);
      box-shadow:0 0 0 3px rgba(125,211,252,.12) inset;
    }

    main{padding:22px 0 40px}
    .card{
      background:rgba(15,23,42,.70);
      border:1px solid var(--line);
      border-radius:18px;
      padding:18px;
      box-shadow:0 10px 35px rgba(0,0,0,.25)
    }
    h1{margin:0 0 10px;font-size:30px}
    .muted{color:var(--muted)}

    .btn{
      display:inline-block;
      margin-top:12px;
      padding:12px 14px;
      border-radius:14px;
      border:1px solid rgba(125,211,252,.45);
      background:rgba(125,211,252,.12);
      color:var(--text);
      text-decoration:none;
      font-weight:700;
    }
    .btn:hover{background:rgba(125,211,252,.18)}

    .info{
      margin-top:14px;
      padding:12px;
      border-radius:14px;
      background:rgba(255,255,255,.06);
      border:1px solid var(--line);
      color:var(--muted);
      font-size:14px;
    }

    @media (max-width:520px){
      .wrap{padding:14px}
      nav a{font-size:15px}
      .card{padding:14px}
      h1{font-size:26px}
    }
  </style>
</head>

<body>
<header>
  <div class="wrap">
    <nav>
      <span class="brand">Tipsklub365</span>
      <a href="index.html">Forside</a>
      <a href="regler.html">Regler</a>
      <a href="om.html">Om os</a>
      <a class="active" href="regnskab.html">Regnskab</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="card">
    <h1>Regnskab</h1>
    <p class="muted">
      Her finder du det samlede regnskab for Tipsklubben anno feb 22.
    </p>

    <a class="btn" target="_blank" rel="noopener"
       href="https://1drv.ms/x/c/2befafc054844edf/IQADkn60j4h1Rb4mad-8_w8JAWIsWzGfIWNU2IYUDYpSUHo?e=KDLOEt">
      Åbn Excel-regnskab →
    </a>

    <div class="info">
      Regnskabet opdateres løbende. Linket er kun til visning – ingen kan redigere.
    </div>
  </section>
</main>

</body>
</html>
